<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BehaviorFN - Quick Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      margin: 0.25rem;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #0052a3; }
    input, textarea {
      padding: 0.5rem;
      margin: 0.5rem 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 100%;
    }
    .demo {
      background: #f9f9f9;
      padding: 1rem;
      border-radius: 4px;
      margin: 1rem 0;
    }
    dialog {
      border: none;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    dialog::backdrop {
      background: rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <h1>🎯 BehaviorFN Quick Test</h1>
  <p>Test command + reveal behaviors with auto-loader.</p>

  <div class="demo">
    <h2>Command + Reveal</h2>
    <button behavior="command" commandfor="modal" command="show">
      Open Modal
    </button>
    
    <dialog behavior="reveal" id="modal">
      <h3>Hello from Reveal!</h3>
      <p>This dialog uses reveal behavior.</p>
      <button behavior="command" commandfor="modal" command="hide">
        Close
      </button>
    </dialog>
  </div>

  <div class="demo">
    <h2>Auto-Grow Textarea</h2>
    <textarea behavior="auto-grow" placeholder="Type multiple lines..."></textarea>
  </div>

  <div class="demo">
    <h2>Compute</h2>
    <input type="number" id="a" value="5" placeholder="A">
    <input type="number" id="b" value="3" placeholder="B">
    <input behavior="compute" compute-formula="#a + #b" readonly placeholder="Result">
  </div>

  <script type="module">
    // Import behaviors (auto-register on import)
    import '../dist/cdn/command.js';
    import '../dist/cdn/reveal.js';
    import '../dist/cdn/auto-grow.js';
    import '../dist/cdn/compute.js';
    
    // Import auto-loader (auto-enables on import)
    import '../dist/cdn/auto-loader.js';
    
    console.log('✅ Behaviors loaded with auto-loader!');
  </script>
</body>
</html>
