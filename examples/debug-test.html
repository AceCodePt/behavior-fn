<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      margin: 0.5rem;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    dialog {
      border: none;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    dialog::backdrop {
      background: rgba(0,0,0,0.5);
    }
    #console-output {
      background: #f5f5f5;
      border: 1px solid #ddd;
      padding: 1rem;
      margin-top: 1rem;
      font-family: monospace;
      font-size: 0.9em;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>🐛 Debug Test</h1>
  
  <h2>Test 1: Manual Registration (No Auto-Loader)</h2>
  <button id="manual-trigger">Open Dialog (Manual)</button>
  <dialog id="manual-modal">
    <h3>Manual Dialog</h3>
    <p>This uses manual registration.</p>
    <button id="manual-close">Close</button>
  </dialog>

  <hr style="margin: 2rem 0;">

  <h2>Test 2: With Behavior Attributes</h2>
  <button behavior="command" commandfor="modal2" command="show">
    Open Dialog (Behavior Attr)
  </button>
  <dialog behavior="reveal" id="modal2">
    <h3>Behavior Dialog</h3>
    <p>This uses behavior attributes.</p>
    <button behavior="command" commandfor="modal2" command="hide">
      Close
    </button>
  </dialog>

  <h2>Console Output:</h2>
  <div id="console-output"></div>

  <script type="module">
    const output = document.getElementById('console-output');
    const originalLog = console.log;
    const originalWarn = console.warn;
    const originalError = console.error;

    function logToPage(type, ...args) {
      const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
      const line = document.createElement('div');
      line.textContent = `[${type}] ${msg}`;
      line.style.color = type === 'error' ? 'red' : type === 'warn' ? 'orange' : 'black';
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    console.log = (...args) => {
      originalLog.apply(console, args);
      logToPage('log', ...args);
    };
    console.warn = (...args) => {
      originalWarn.apply(console, args);
      logToPage('warn', ...args);
    };
    console.error = (...args) => {
      originalError.apply(console, args);
      logToPage('error', ...args);
    };

    console.log('=== Starting imports ===');

    // Import core first
    console.log('Importing behavior-fn-core...');
    const { registerBehavior, defineBehavioralHost, getBehavior, getBehaviorDef } = await import('../dist/cdn/behavior-fn-core.js');
    console.log('✅ Core imported');

    // Import command behavior
    console.log('Importing command behavior...');
    const commandModule = await import('../dist/cdn/command.js');
    console.log('✅ Command imported:', Object.keys(commandModule));

    // Import reveal behavior
    console.log('Importing reveal behavior...');
    const revealModule = await import('../dist/cdn/reveal.js');
    console.log('✅ Reveal imported:', Object.keys(revealModule));

    // Check what's registered
    console.log('Checking registrations...');
    console.log('Command behavior registered:', getBehavior('command') ? 'YES' : 'NO');
    console.log('Reveal behavior registered:', getBehavior('reveal') ? 'YES' : 'NO');

    // Test 1: Manual registration without behavior attributes
    console.log('\n=== Test 1: Manual Setup ===');
    const manualTrigger = document.getElementById('manual-trigger');
    const manualModal = document.getElementById('manual-modal');
    const manualClose = document.getElementById('manual-close');

    manualTrigger.addEventListener('click', () => {
      console.log('Manual trigger clicked');
      manualModal.showModal();
    });

    manualClose.addEventListener('click', () => {
      console.log('Manual close clicked');
      manualModal.close();
    });

    console.log('✅ Manual test setup complete');

    // Import auto-loader LAST
    console.log('\n=== Importing auto-loader ===');
    await import('../dist/cdn/auto-loader.js');
    console.log('✅ Auto-loader imported');

    // Check if elements were upgraded
    console.log('\n=== Checking element upgrades ===');
    const behaviorButtons = document.querySelectorAll('[behavior="command"]');
    console.log(`Found ${behaviorButtons.length} elements with behavior="command"`);
    behaviorButtons.forEach((btn, i) => {
      console.log(`  Button ${i}: has 'is' attr = ${btn.hasAttribute('is')}, is="${btn.getAttribute('is')}"`);
    });

    const behaviorDialogs = document.querySelectorAll('[behavior="reveal"]');
    console.log(`Found ${behaviorDialogs.length} elements with behavior="reveal"`);
    behaviorDialogs.forEach((dlg, i) => {
      console.log(`  Dialog ${i}: has 'is' attr = ${dlg.hasAttribute('is')}, is="${dlg.getAttribute('is')}"`);
    });

    console.log('\n=== All setup complete ===');
  </script>
</body>
</html>
